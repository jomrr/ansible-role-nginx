---
# role: nginx
# file: molecule/resources/playbooks/side_effect.yml

- name: NGINX | Enable optional compatibility settings
  hosts: all
  gather_facts: true
  vars:
    nginx_modules: '{{ [__nginx_test_modules[ansible_facts.os_family]] }}'
    nginx_proxy_websockets: true
    nginx_proxy_drop_headers: []
    nginx_proxy_hide_headers: []
    nginx_resolver_valid: 1s
    nginx_limit_req_status: 503
    nginx_limit_req_zones:
      - name: login
        key: $binary_remote_addr
        size: 10m
        rate: 1r/m
    nginx_protocols:
      - TLSv1.2
      - TLSv1.3
    nginx_security_headers:
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
      X-Frame-Options: SAMEORIGIN
      X-XSS-Protection: '0'
      X-Permitted-Cross-Domain-Policies: none
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: NGINX | Exercise the selected dynamic module
      ansible.builtin.uri:
        use_proxy: false
        url: http://127.0.0.1:8080/module
        headers:
          Host: app.molecule.example
        return_content: true
      register: __nginx_test_module_response

    - name: NGINX | Assert the module produced its response
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_module_response.content | trim == 'module-loaded'

    - name: NGINX | Read proxy headers for allowed and rejected upgrades after reload
      ansible.builtin.uri:
        use_proxy: false
        url: http://127.0.0.1:8080/resolved
        headers: '{{ __nginx_test_spoofed_headers | combine(__nginx_test_upgrade_case.headers) }}'
        return_content: true
      loop:
        - name: absent
          headers: {}
          expected_upgrade: ''
          expected_connection: ''
        - name: websocket
          headers:
            Upgrade: websocket
          expected_upgrade: websocket
          expected_connection: upgrade
        - name: mixed-case websocket
          headers:
            Upgrade: WebSocket
          expected_upgrade: websocket
          expected_connection: upgrade
        - name: h2c
          headers:
            Upgrade: h2c
          expected_upgrade: ''
          expected_connection: ''
        - name: unknown protocol
          headers:
            Upgrade: arbitrary
          expected_upgrade: ''
          expected_connection: ''
        - name: protocol list
          headers:
            Upgrade: websocket, h2c
          expected_upgrade: ''
          expected_connection: ''
      loop_control:
        loop_var: __nginx_test_upgrade_case
        label: '{{ __nginx_test_upgrade_case.name }}'
      register: __nginx_test_upgrades

    - name: NGINX | Assert upgrade policy and empty additional header-removal list after reload
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            __nginx_test_response.content == 'host=app.molecule.example;proto=http;upgrade='
            ~ __nginx_test_response.__nginx_test_upgrade_case.expected_upgrade ~ ';proxy='
          - >-
            __nginx_test_response.x_test_connection | default('')
            == __nginx_test_response.__nginx_test_upgrade_case.expected_connection
          - __nginx_test_response.x_test_identity == '127.0.0.1;127.0.0.1;'
          - __nginx_test_response.x_test_forwarded_host == 'app.molecule.example'
          - __nginx_test_response.x_test_forwarded_port == '8080'
          - __nginx_test_response.x_test_forwarded_ssl == 'on'
          - __nginx_test_response.x_test_forwarded_scheme == 'https'
          - __nginx_test_response.x_test_forwarded_prefix == '/injected'
          - __nginx_test_response.x_test_original_url == '/admin'
          - __nginx_test_response.x_test_rewrite_url == '/admin'
          - __nginx_test_response.x_test_true_client_ip == '192.0.2.50'
          - __nginx_test_response.x_test_client_ip == '192.0.2.50'
          - __nginx_test_response.x_test_cf_connecting_ip == '192.0.2.50'
          - __nginx_test_response.x_test_cluster_client_ip == '192.0.2.50'
          - __nginx_test_response.x_frame_options == 'SAMEORIGIN'
          - __nginx_test_response.x_permitted_cross_domain_policies == 'none'
          - __nginx_test_response.x_powered_by == 'fixture'
          - __nginx_test_response.x_aspnet_version == 'fixture'
          - __nginx_test_response.x_aspnetmvc_version == 'fixture'
          - __nginx_test_response.x_runtime == 'fixture'
          - __nginx_test_response.x_generator == 'fixture'
      loop: '{{ __nginx_test_upgrades.results }}'
      loop_control:
        loop_var: __nginx_test_response
        label: '{{ __nginx_test_response.__nginx_test_upgrade_case.name }}'

    - name: NGINX | Probe limited and unrestricted routes
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --noproxy
          - '*'
          - --interface
          - 127.0.0.2
          - --max-time
          - '5'
          - --header
          - 'Host: app.molecule.example'
          - --write-out
          - '%{http_code}\n'
          - --output
          - /dev/null
          - http://127.0.0.1:8080/limited
          - --output
          - /dev/null
          - http://127.0.0.1:8080/limited
          - --output
          - /dev/null
          - http://127.0.0.1:8080/
          - --output
          - /dev/null
          - http://127.0.0.1:8080/
      changed_when: false
      register: __nginx_test_rates

    - name: NGINX | Assert overridden rate-limit status after reload
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_rates.stdout_lines == ['200', '503', '200', '200']

    - name: NGINX | Read service lifecycle log after reload
      become: true
      become_user: root
      ansible.builtin.slurp:
        src: /var/log/nginx/error.log
      register: __nginx_test_lifecycle_log

    - name: NGINX | Assert reload lifecycle events are logged
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_lifecycle_log.content | b64decode is search('\[notice\].*reconfiguring')

    - name: NGINX | Verify explicitly enabled TLS 1.2 after reload
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - 127.0.0.1:8443
          - -servername
          - app.molecule.example
          - -verify_hostname
          - app.molecule.example
          - -CAfile
          - /etc/nginx-test/cert.pem
          - -verify_return_error
          - -brief
          - -tls1_2
        stdin: ''
      changed_when: false
      register: __nginx_test_legacy_tls

    - name: NGINX | Assert TLS 1.2 negotiated with the compatibility override
      ansible.builtin.assert:
        quiet: true
        that:
          - "'TLSv1.2' in __nginx_test_legacy_tls.stderr"

- name: NGINX | Enable HTTP/3 and disable HTTP/2 on existing listeners
  hosts: all
  gather_facts: true
  vars:
    nginx_modules: '{{ [__nginx_test_modules[ansible_facts.os_family]] }}'
    nginx_http2: false
    nginx_http3: "{{ ansible_facts.os_family != 'Suse' }}"
    nginx_vhosts:
      - name: protocol-fixture
        config: |-
          {% if nginx_http3 %}
          error_log /var/log/nginx/quic-test.log info;
          {% endif %}
          server {
              listen 127.0.0.1:18081;
              server_name backend.molecule.example;
              location / {
                  add_header X-Powered-By fixture;
                  add_header X-AspNet-Version fixture;
                  add_header X-AspNetMvc-Version fixture;
                  add_header X-Runtime fixture;
                  add_header X-Generator fixture;
                  add_header X-Permitted-Cross-Domain-Policies all;
                  add_header Content-Security-Policy "default-src 'self'";
                  add_header Referrer-Policy same-origin;
                  add_header X-Content-Type-Options nosniff;
                  add_header X-Frame-Options SAMEORIGIN;
                  return 200 "backend=$server_protocol;host=$http_host";
              }
          }
          {% for __nginx_test_name in ['app.molecule.example', 'second.molecule.example'] %}
          server {
              listen 8443 ssl;
          {% if nginx_http3 %}
              listen 8443 quic;
          {% endif %}
              server_name {{ __nginx_test_name }};
              ssl_certificate /etc/nginx-test/cert.pem;
              ssl_certificate_key /etc/nginx-test/key.pem;
              proxy_hide_header X-Powered-By;
              proxy_hide_header X-AspNet-Version;
              proxy_hide_header X-AspNetMvc-Version;
              proxy_hide_header X-Runtime;
              proxy_hide_header X-Generator;
              proxy_hide_header Strict-Transport-Security;
              proxy_hide_header X-Permitted-Cross-Domain-Policies;
              add_header X-Permitted-Cross-Domain-Policies none always;
              add_header Strict-Transport-Security "max-age=31536000" always;
          {% if nginx_http3 %}
              add_header Alt-Svc 'h3=":8443"; ma=86400' always;
          {% endif %}
              location / { proxy_pass http://127.0.0.1:18081; }
          }
          {% endfor %}
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
  post_tasks:
    - name: NGINX | Negotiate TCP fallback after disabling HTTP/2
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - curl
          - --http2
          - --cacert
          - /etc/nginx-test/cert.pem
          - --noproxy
          - '*'
          - --resolve
          - app.molecule.example:8443:127.0.0.1
          - --max-time
          - '5'
          - --silent
          - --show-error
          - --dump-header
          - '-'
          - --output
          - /dev/null
          - --write-out
          - '%{http_version}'
          - https://app.molecule.example:8443/
      changed_when: false
      register: __nginx_test_tcp

    - name: NGINX | Assert TCP fallback and opt-in HTTP/3 advertisement
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_tcp.stdout_lines[-1] == '1.1'
          - "('alt-svc: h3=\":8443\"; ma=86400' in __nginx_test_tcp.stdout | lower) == nginx_http3"
          - "'strict-transport-security: max-age=31536000' in __nginx_test_tcp.stdout | lower"
          - "'referrer-policy: same-origin' in __nginx_test_tcp.stdout | lower"
          - "'x-permitted-cross-domain-policies: none' in __nginx_test_tcp.stdout | lower"
          - >-
            __nginx_test_tcp.stdout is not search('(?im)^x-(powered-by|aspnet-version|aspnetmvc-version|runtime|generator):')

    - name: NGINX | Restart existing test containers to verify boot-time service startup
      delegate_to: localhost
      containers.podman.podman_container:
        name: '{{ inventory_hostname }}'
        state: started
        force_restart: true

    - name: NGINX | Wait for restarted targets
      ansible.builtin.wait_for_connection:
        timeout: 90

    - name: NGINX | Restore fixture name resolution after container reboot
      ansible.builtin.import_tasks: ../tasks/fixture_hosts.yml

    - name: NGINX | Wait for TLS service after container reboot
      become: true
      become_user: root
      ansible.builtin.uri:
        use_proxy: false
        url: https://app.molecule.example:8443/
        ca_path: /etc/nginx-test/cert.pem
      register: __nginx_test_boot_response
      until: __nginx_test_boot_response is succeeded
      retries: 10
      delay: 1

    - name: NGINX | Check applied QUIC labels without changing policy
      become: true
      become_user: root
      community.general.seport:
        ports: '8443'
        proto: udp
        setype: http_port_t
        state: present
      check_mode: true
      register: __nginx_test_port_policy
      when:
        - nginx_http3
        - ansible_facts.selinux.status == 'enabled'

    - name: NGINX | Assert the configured QUIC UDP port is already labeled
      ansible.builtin.assert:
        quiet: true
        that:
          - not __nginx_test_port_policy.changed
      when:
        - nginx_http3
        - ansible_facts.selinux.status == 'enabled'

    - name: NGINX | Verify HTTP/3 directly on the test target
      when: nginx_http3
      environment:
        NO_PROXY: '*'
      block:
        - name: NGINX | Negotiate HTTP/3 for both virtual hosts on the shared QUIC socket
          ansible.builtin.command:
            argv:
              - /opt/nginx-test-http3/bin/curl-cffi
              - get
              - --http3-only
              - --no-verify
              - --no-follow
              - --timeout
              - '10'
              - --print
              - hb
              - 'https://{{ __nginx_test_name }}:8443/'
          changed_when: false
          loop:
            - app.molecule.example
            - second.molecule.example
          loop_control:
            loop_var: __nginx_test_name
          register: __nginx_test_quic

        - name: NGINX | Assert QUIC routing and preserved security headers
          ansible.builtin.assert:
            quiet: true
            that:
              - "'HTTP/3 200' in __nginx_test_response.stdout"
              - "'backend=HTTP/1.1;host=' ~ __nginx_test_response.__nginx_test_name in __nginx_test_response.stdout"
              - "'alt-svc: h3=\":8443\"; ma=86400' in __nginx_test_response.stdout | lower"
              - "'strict-transport-security: max-age=31536000' in __nginx_test_response.stdout | lower"
              - "'referrer-policy: same-origin' in __nginx_test_response.stdout | lower"
              - "'x-content-type-options: nosniff' in __nginx_test_response.stdout | lower"
              - "'x-frame-options: sameorigin' in __nginx_test_response.stdout | lower"
              - "'content-security-policy:' in __nginx_test_response.stdout | lower"
              - "'x-powered-by:' not in __nginx_test_response.stdout | lower"
              - "'x-aspnet-version:' not in __nginx_test_response.stdout | lower"
              - "'x-aspnetmvc-version:' not in __nginx_test_response.stdout | lower"
              - "'x-runtime:' not in __nginx_test_response.stdout | lower"
              - "'x-generator:' not in __nginx_test_response.stdout | lower"
              - "'x-permitted-cross-domain-policies: none' in __nginx_test_response.stdout | lower"
          loop: '{{ __nginx_test_quic.results }}'
          loop_control:
            loop_var: __nginx_test_response
            label: '{{ __nginx_test_response.__nginx_test_name }}'

        - name: NGINX | Probe unknown SNI through the QUIC default listener
          ansible.builtin.command:
            argv:
              - timeout
              - 10s
              - openssl
              - s_client
              - -quic
              - -alpn
              - h3
              - -connect
              - 127.0.0.1:8443
              - -servername
              - unknown.molecule.example
              - -brief
            stdin: ''
          changed_when: false
          failed_when: false
          register: __nginx_test_unknown_quic

        - name: NGINX | Read the QUIC handshake rejection log
          become: true
          become_user: root
          ansible.builtin.slurp:
            src: /var/log/nginx/quic-test.log
          register: __nginx_test_quic_log

        - name: NGINX | Assert unknown QUIC SNI is rejected without an HTTP response or timeout
          ansible.builtin.assert:
            quiet: true
            that:
              - __nginx_test_unknown_quic.rc != 0
              - __nginx_test_unknown_quic.rc != 124
              - __nginx_test_unknown_quic.stdout == ''
              - "'handshake rejected while handling frames' in __nginx_test_quic_log.content | b64decode"

- name: NGINX | Remove existing vhosts
  hosts: all
  gather_facts: true
  vars:
    nginx_default_server_return: 444
    nginx_http3: false
    nginx_systemd_hardening: false
    nginx_modules: []
    nginx_vhosts: []
    nginx_resolvers: []
    nginx_limit_req_zones: []
    nginx_limit_conn_zones: []
  roles:
    - role: '{{ lookup(''ansible.builtin.env'', ''MOLECULE_PROJECT_DIRECTORY'') }}'
  post_tasks:

    - name: NGINX | Read remaining packages after module deselection
      ansible.builtin.package_facts:
        manager: auto

    - name: NGINX | Read service settings after disabling hardening
      become: true
      become_user: root
      ansible.builtin.systemd_service:
        name: nginx
        state: started
      check_mode: true
      register: __nginx_test_unhardened

    - name: NGINX | Assert optional hardening and dynamic module removal
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_modules[ansible_facts.os_family].package not in ansible_facts.packages
          - __nginx_test_unhardened.status.ProtectSystem != 'strict'
          - __nginx_test_unhardened.status.Restart != 'always'

    - name: NGINX | Verify removed hosts receive no HTTP response with 444
      ansible.builtin.command:
        argv:
          - curl
          - --http1.1
          - --noproxy
          - '*'
          - --max-time
          - '5'
          - --silent
          - --show-error
          - --header
          - 'Host: {{ __nginx_test_host }}'
          - http://127.0.0.1:8080/
      changed_when: false
      failed_when: __nginx_test_denial.rc != 52
      register: __nginx_test_denial
      loop:
        - app.molecule.example
        - removed.molecule.example
      loop_control:
        loop_var: __nginx_test_host

    - name: NGINX | Wait for the QUIC listener to close after disabling HTTP/3
      ansible.builtin.slurp:
        src: /proc/net/udp
      register: __nginx_test_udp
      until: __nginx_test_udp.content | b64decode is not search('(?m)^\s*\d+:\s+[0-9A-F]+:20FB\s')
      retries: 10
      delay: 1
