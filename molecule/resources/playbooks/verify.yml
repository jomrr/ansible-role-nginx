---
# role: nginx
# file: molecule/resources/playbooks/verify.yml

- name: NGINX | Verify
  hosts: all
  gather_facts: false
  tasks:

    - name: NGINX | Negotiate default HTTP/2 over TLS
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - curl
          - --http2
          - --cacert
          - /etc/nginx-test/cert.pem
          - --noproxy
          - '*'
          - --resolve
          - app.molecule.example:8443:127.0.0.1
          - --max-time
          - '5'
          - --silent
          - --show-error
          - --dump-header
          - '-'
          - --output
          - /dev/null
          - --write-out
          - '%{http_version}'
          - https://app.molecule.example:8443/
      changed_when: false
      register: __nginx_test_http2

    - name: NGINX | Assert HTTP/2 and inherited headers without HTTP/3 advertisement
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_http2.stdout_lines[-1] == '2'
          - "'x-content-type-options: nosniff' in __nginx_test_http2.stdout | lower"
          - "'x-frame-options: DENY' in __nginx_test_http2.stdout"
          - "'x-permitted-cross-domain-policies: none' in __nginx_test_http2.stdout | lower"
          - "'alt-svc:' not in __nginx_test_http2.stdout | lower"

    - name: NGINX | Probe cleartext HTTP/2 for known and unknown hosts
      ansible.builtin.command:
        argv:
          - curl
          - --http2-prior-knowledge
          - --noproxy
          - '*'
          - --max-time
          - '5'
          - --silent
          - --show-error
          - --header
          - 'Host: {{ __nginx_test_host }}'
          - --output
          - /dev/null
          - --write-out
          - '%{http_version}'
          - http://127.0.0.1:8080/
      changed_when: false
      failed_when: false
      loop:
        - app.molecule.example
        - unknown.example
      loop_control:
        loop_var: __nginx_test_host
      register: __nginx_test_h2c

    - name: NGINX | Assert cleartext HTTP/2 is rejected without a timeout
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_probe.rc != 0
          - __nginx_test_probe.rc != 28
          - __nginx_test_probe.stdout != '2'
      loop: '{{ __nginx_test_h2c.results }}'
      loop_control:
        loop_var: __nginx_test_probe
        label: '{{ __nginx_test_probe.__nginx_test_host }}'

    - name: NGINX | Verify unknown HTTP host is denied
      ansible.builtin.uri:
        use_proxy: false
        url: http://127.0.0.1:8080/
        headers:
          Host: unknown.example
        status_code: 404

    - name: NGINX | Verify proxy routes and sanitized client headers
      ansible.builtin.uri:
        use_proxy: false
        url: http://127.0.0.1:8080{{ __nginx_test_path }}
        headers: "{{ __nginx_test_spoofed_headers | combine({'Upgrade': 'websocket'}) }}"
        return_content: true
      loop:
        - /
        - /favicon.ico
        - /robots.txt
        - /asset.html
        - /resolved
      loop_control:
        loop_var: __nginx_test_path
      register: __nginx_test_responses

    - name: NGINX | Assert forwarded identity and inherited security headers
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_response.content == 'host=app.molecule.example;proto=http;upgrade=;proxy='
          - __nginx_test_response.x_test_identity == '127.0.0.1;127.0.0.1;'
          - "'x_test_connection' not in __nginx_test_response"
          - "'x_test_forwarded_ssl' not in __nginx_test_response"
          - "'x_test_forwarded_scheme' not in __nginx_test_response"
          - "'x_test_forwarded_prefix' not in __nginx_test_response"
          - "'x_test_original_url' not in __nginx_test_response"
          - "'x_test_rewrite_url' not in __nginx_test_response"
          - "'x_test_true_client_ip' not in __nginx_test_response"
          - "'x_test_client_ip' not in __nginx_test_response"
          - "'x_test_cf_connecting_ip' not in __nginx_test_response"
          - "'x_test_cluster_client_ip' not in __nginx_test_response"
          - __nginx_test_response.x_content_type_options == 'nosniff'
          - __nginx_test_response.referrer_policy == 'strict-origin-when-cross-origin'
          - __nginx_test_response.x_frame_options == 'DENY'
          - __nginx_test_response.x_xss_protection == '0'
          - __nginx_test_response.x_permitted_cross_domain_policies == 'none'
          - "'x_powered_by' not in __nginx_test_response"
          - "'x_aspnet_version' not in __nginx_test_response"
          - "'x_aspnetmvc_version' not in __nginx_test_response"
          - "'x_runtime' not in __nginx_test_response"
          - "'x_generator' not in __nginx_test_response"
          - __nginx_test_response.content_security_policy == "default-src 'self'"
          - __nginx_test_response.server == 'nginx'
      loop: '{{ __nginx_test_responses.results }}'
      loop_control:
        loop_var: __nginx_test_response
        label: '{{ __nginx_test_response.url }}'

    - name: NGINX | Read access log for existing HTTP and HTTPS requests
      become: true
      become_user: root
      ansible.builtin.slurp:
        src: /var/log/nginx/access.log
      register: __nginx_test_access_log

    - name: NGINX | Assert host transport timing and upstream log context
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            __nginx_test_access_log.content | b64decode is search(
            'host="app.molecule.example" server="app.molecule.example" tls="TLSv1.3" '
            ~ 'cipher="TLS_[^"]+" request_time="[0-9.]+" upstream="127.0.0.1:18081"')
          - >-
            __nginx_test_access_log.content | b64decode is search(
            'host="app.molecule.example" server="app.molecule.example" tls="-" '
            ~ 'cipher="-" request_time="[0-9.]+" upstream="127.0.0.1:18081"')
          - >-
            'host="unknown.example" server="_"'
            in __nginx_test_access_log.content | b64decode

    - name: NGINX | Probe concurrent requests on limited and unrestricted routes
      ansible.builtin.command:
        argv:
          - curl
          - --parallel
          - --parallel-immediate
          - --parallel-max
          - '2'
          - --http1.1
          - --silent
          - --show-error
          - --noproxy
          - '*'
          - --max-time
          - '15'
          - --header
          - 'Host: app.molecule.example'
          - --write-out
          - '%{http_code}\n'
          - --output
          - /dev/null
          - 'http://127.0.0.1:8080/{{ __nginx_test_route }}'
          - --output
          - /dev/null
          - 'http://127.0.0.1:8080/{{ __nginx_test_route }}'
      changed_when: false
      loop:
        - concurrent
        - concurrent-unlimited
      loop_control:
        loop_var: __nginx_test_route
      register: __nginx_test_concurrency

    - name: NGINX | Assert concurrency limits only apply to selected routes
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_concurrency.results[0].stdout_lines | sort == ['200', '503']
          - __nginx_test_concurrency.results[1].stdout_lines == ['200', '200']

    - name: NGINX | Verify concurrency allowance is released after completion
      ansible.builtin.uri:
        use_proxy: false
        url: http://127.0.0.1:8080/concurrent
        headers:
          Host: app.molecule.example

    - name: NGINX | Probe limited and unrestricted routes
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --noproxy
          - '*'
          - --max-time
          - '5'
          - --header
          - 'Host: app.molecule.example'
          - --write-out
          - '%{http_code}\n'
          - --output
          - /dev/null
          - http://127.0.0.1:8080/limited
          - --output
          - /dev/null
          - http://127.0.0.1:8080/limited
          - --output
          - /dev/null
          - http://127.0.0.1:8080/
          - --output
          - /dev/null
          - http://127.0.0.1:8080/
      changed_when: false
      register: __nginx_test_rates

    - name: NGINX | Assert global rejection status and explicit route activation
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_rates.stdout_lines == ['200', '429', '200', '200']

    - name: NGINX | Read rate-limit rejection log
      become: true
      become_user: root
      ansible.builtin.slurp:
        src: /var/log/nginx/error.log
      register: __nginx_test_rate_log

    - name: NGINX | Assert rate-limit rejections use warning severity
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            (__nginx_test_rate_log.content | b64decode)
            is search('\[warn\].*limiting requests.*zone "login"')

    - name: NGINX | Verify known TLS host
      become: true
      become_user: root
      ansible.builtin.uri:
        use_proxy: false
        url: https://app.molecule.example:8443/
        ca_path: /etc/nginx-test/cert.pem
        return_content: true

    - name: NGINX | Probe default TLS protocol policy
      become: true
      become_user: root
      ansible.builtin.command:
        argv:
          - openssl
          - s_client
          - -connect
          - 127.0.0.1:8443
          - -servername
          - app.molecule.example
          - -verify_hostname
          - app.molecule.example
          - -CAfile
          - /etc/nginx-test/cert.pem
          - -verify_return_error
          - -brief
          - '{{ __nginx_test_protocol }}'
        stdin: ''
      loop:
        - -tls1_3
        - -tls1_2
      loop_control:
        loop_var: __nginx_test_protocol
      changed_when: false
      failed_when: false
      register: __nginx_test_protocols

    - name: NGINX | Assert TLS 1.3 succeeds and TLS 1.2 is rejected
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_protocols.results[0].rc == 0
          - "'TLSv1.3' in __nginx_test_protocols.results[0].stderr"
          - __nginx_test_protocols.results[1].rc != 0
          - "'alert protocol version' in __nginx_test_protocols.results[1].stderr"

    - name: NGINX | Place a disclosure probe in the default document root
      become: true
      become_user: root
      ansible.builtin.copy:
        dest: /var/lib/nginx/empty/disclosure.txt
        content: nginx-root-disclosure-probe
        owner: root
        group: root
        mode: '0644'

    - name: NGINX | Verify omitted routes cannot serve the default document root
      ansible.builtin.uri:
        use_proxy: false
        url: http://127.0.0.1:8080/disclosure.txt
        headers:
          Host: static.molecule.example
        status_code: 403
        return_content: true
      register: __nginx_test_root

    - name: NGINX | Assert denial retains security headers and reveals no file content
      ansible.builtin.assert:
        quiet: true
        that:
          - "'nginx-root-disclosure-probe' not in __nginx_test_root.content"
          - __nginx_test_root.x_content_type_options == 'nosniff'
          - __nginx_test_root.x_frame_options == 'DENY'
          - __nginx_test_root.x_xss_protection == '0'

    - name: NGINX | Read TLS rejection for unknown SNI
      community.crypto.get_certificate:
        host: 127.0.0.1
        port: 8443
        server_name: unknown.example
      failed_when: false
      register: __nginx_test_tls

    - name: NGINX | Assert handshake rejection
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_tls.cert is not defined
          - __nginx_test_tls.msg | lower is search('unrecognized[ _]name')

    - name: NGINX | Verify trusted HTTPS upstream
      ansible.builtin.uri:
        use_proxy: false
        url: http://127.0.0.1:8080/trusted
        headers:
          Host: app.molecule.example
        return_content: true
      register: __nginx_test_trusted

    - name: NGINX | Assert HTTPS proxy response
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_trusted.content == 'verified backend'

    - name: NGINX | Reject untrusted or mismatched upstream certificates
      ansible.builtin.uri:
        use_proxy: false
        url: http://127.0.0.1:8080/{{ __nginx_test_endpoint }}
        headers:
          Host: app.molecule.example
        status_code: 502
      loop:
        - untrusted
        - wrong-name
      loop_control:
        loop_var: __nginx_test_endpoint

    - name: NGINX | Read nginx master PID
      become: true
      become_user: root
      ansible.builtin.slurp:
        src: /run/nginx.pid
      register: __nginx_test_pid

    - name: NGINX | Read nginx worker PIDs
      become: true
      become_user: root
      ansible.builtin.slurp:
        src: /proc/{{ __nginx_test_pid.content | b64decode | trim }}/task/{{ __nginx_test_pid.content | b64decode | trim }}/children
      register: __nginx_test_workers

    - name: NGINX | Read worker process limits
      become: true
      become_user: root
      ansible.builtin.slurp:
        src: /proc/{{ __nginx_test_worker }}/limits
      loop: '{{ (__nginx_test_workers.content | b64decode).split() }}'
      loop_control:
        loop_var: __nginx_test_worker
      register: __nginx_test_limits

    - name: NGINX | Assert workers have zero core-file limits
      ansible.builtin.assert:
        quiet: true
        that:
          - __nginx_test_limits.results | length > 0
          - >-
            __nginx_test_limits.results | map(attribute='content') | map('b64decode')
            | select('search', '(?m)^Max core file size\s+0\s+0\s+bytes\s*$')
            | list | length == __nginx_test_limits.results | length

    - name: NGINX | Read service enablement
      ansible.builtin.service_facts:

    - name: NGINX | Assert service is enabled
      ansible.builtin.assert:
        quiet: true
        that:
          - ansible_facts.services['nginx.service'].status == 'enabled'
