---
# role: nginx
# file: molecule/default/molecule.yml

dependency:
  name: "galaxy"
driver:
  name: "podman"
provisioner:
  name: "ansible"
  config_options:
    defaults:
      forks: 8
      interpreter_python: "auto_silent"
      callbacks_enabled: "ansible.posix.profile_tasks,ansible.posix.timer"
      callback_result_format: "yaml"
    ssh_connection:
      pipelining: true
  log: true
  playbooks:
    prepare: "../resources/playbooks/prepare.yml"
    converge: "../resources/playbooks/converge.yml"
    verify: "../resources/playbooks/verify.yml"
    side_effect: "../resources/playbooks/side_effect.yml"
  inventory:
    group_vars:
      all:
        __nginx_test_spoofed_headers:
          Host: "app.molecule.example"
          Connection: "upgrade"
          X-Forwarded-For: "192.0.2.50"
          X-Real-IP: "192.0.2.50"
          Forwarded: "for=192.0.2.50"
          Proxy: "attacker.invalid"
          X-Forwarded-Ssl: "on"
          X-Forwarded-Scheme: "https"
          X-Forwarded-Prefix: "/injected"
          X-Original-URL: "/admin"
          X-Rewrite-URL: "/admin"
          True-Client-IP: "192.0.2.50"
          X-Client-IP: "192.0.2.50"
          CF-Connecting-IP: "192.0.2.50"
          X-Cluster-Client-IP: "192.0.2.50"
        nginx_worker_processes: "1"
        nginx_sebooleans:
          httpd_can_network_connect: true
        nginx_resolvers:
          - "127.0.0.1:1053"
        nginx_listen:
          - port: 8080
          - port: 8443
            protocol: "https"
        nginx_vhosts:
          - name: "fixture"
            config: |-
              server {
                  listen 127.0.0.1:18081;
                  server_name backend.molecule.example;
                  location / {
                      add_header X-Frame-Options SAMEORIGIN;
                      add_header X-XSS-Protection "1; mode=block";
                      add_header Content-Security-Policy "default-src 'self'";
                      add_header X-Test-Identity "$$http_x_forwarded_for;$$http_x_real_ip;$$http_forwarded";
                      add_header X-Test-Connection $$http_connection;
                      add_header X-Test-Forwarded-Ssl $$http_x_forwarded_ssl;
                      add_header X-Test-Forwarded-Scheme $$http_x_forwarded_scheme;
                      add_header X-Test-Forwarded-Prefix $$http_x_forwarded_prefix;
                      add_header X-Test-Original-URL $$http_x_original_url;
                      add_header X-Test-Rewrite-URL $$http_x_rewrite_url;
                      add_header X-Test-True-Client-IP $$http_true_client_ip;
                      add_header X-Test-Client-IP $$http_x_client_ip;
                      add_header X-Test-CF-Connecting-IP $$http_cf_connecting_ip;
                      add_header X-Test-Cluster-Client-IP $$http_x_cluster_client_ip;
                      return 200 "host=$$http_host;proto=$$http_x_forwarded_proto;upgrade=$$http_upgrade;proxy=$$http_proxy";
                  }
              }
              server {
                  listen 127.0.0.1:18444 ssl;
                  server_name backend.molecule.example;
                  ssl_certificate /etc/nginx-test/cert.pem;
                  ssl_certificate_key /etc/nginx-test/key.pem;
                  location / { return 200 "verified backend"; }
              }
              server {
                  listen 8080;
                  listen 8443 ssl;
                  server_name app.molecule.example;
                  ssl_certificate /etc/nginx-test/cert.pem;
                  ssl_certificate_key /etc/nginx-test/key.pem;
                  location / { proxy_pass http://127.0.0.1:18081; }
                  location = /resolved {
                      set $$dynamic_backend dynamic.molecule.example:18081;
                      proxy_pass http://$$dynamic_backend;
                  }
                  location = /limited {
                      limit_req zone=login;
                      proxy_pass http://127.0.0.1:18081;
                  }
                  location /trusted {
                      proxy_pass https://127.0.0.1:18444;
                      proxy_ssl_name backend.molecule.example;
                      proxy_ssl_trusted_certificate /etc/nginx-test/cert.pem;
                  }
                  location /untrusted {
                      proxy_pass https://127.0.0.1:18444;
                      proxy_ssl_name backend.molecule.example;
                  }
                  location /wrong-name {
                      proxy_pass https://127.0.0.1:18444;
                      proxy_ssl_name wrong.molecule.example;
                      proxy_ssl_trusted_certificate /etc/nginx-test/cert.pem;
                  }
              }
          - name: "implicit-root"
            config: "server { listen 8080; server_name static.molecule.example; }"
          - name: "removed"
            config: "server { listen 8080; server_name removed.molecule.example; return 200 \"present\"; }"
verifier:
  name: "ansible"
scenario:
  test_sequence:
    - "dependency"
    - "cleanup"
    - "destroy"
    - "syntax"
    - "create"
    - "prepare"
    - "check"
    - "converge"
    - "idempotence"
    - "check"
    - "verify"
    - "side_effect"
    - "cleanup"
    - "destroy"
  name: "default"
platforms:
  - name: "nginx"
    image: "docker.io/${uns:-jomrr}/molecule-${img:-fedora}:${tag:-latest}"
    pre_build_image: true
    override_command: false
    systemd: "true"
